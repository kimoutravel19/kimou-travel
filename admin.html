<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimou Travel | Workspace Admin</title>
    <!-- React & Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            .printable-section, .printable-section * { visibility: visible; }
            .printable-section { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            
            const [username, setUsername] = useState(() => {
                return localStorage.getItem('kimou_admin_user') || 'admin_kimou';
            });
            const [password, setPassword] = useState(() => {
                return localStorage.getItem('kimou_admin_pass') || '123456';
            });

            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');

            const [newPassword, setNewPassword] = useState('');
            const [passMsg, setPassMsg] = useState('');

            // الفلاتر للسناديق الثلاثة
            const [pendingFilter, setPendingFilter] = useState('all');
            const [notifiedFilter, setNotifiedFilter] = useState('all');
            const [processedFilter, setProcessedFilter] = useState('all');

            const [offers, setOffers] = useState(() => {
                const saved = localStorage.getItem('kimou_offers');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: 'رحلة الصحراء - تاغيت', duration: '5 أيام', departureDate: '2026-11-10', returnDate: '2026-11-15', price: '38,000 DA', desc: 'فندق 4 نجوم، نقل مريح، وسهرات استثنائية.', image: 'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=600&q=80' },
                    { id: 2, title: 'عطلة جزيرة بالي', duration: '10 أيام', departureDate: '2026-12-01', returnDate: '2026-12-11', price: '240,000 DA', desc: 'منتجع شاطئي، رحلات استكشافية، وجولات سياحية.', image: 'https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=600&q=80' }
                ];
            });

            const [newOffer, setNewOffer] = useState({ title: '', duration: '', departureDate: '', returnDate: '', price: '', desc: '', image: '' });

            const fetchBookings = () => {
                const saved = localStorage.getItem('kimou_bookings');
                return saved ? JSON.parse(saved) : [
                    { id: 101, name: 'عبد الحفيظ مزهود', date: '2026-11-05', phone: '0549055155', trip: 'رحلة الصحراء', status: 'pending' }
                ];
            };

            const [bookings, setBookings] = useState(fetchBookings);

            useEffect(() => {
                const syncData = () => {
                    const latestBookings = fetchBookings();
                    setBookings(latestBookings);

                    const savedOffers = localStorage.getItem('kimou_offers');
                    if (savedOffers) {
                        setOffers(JSON.parse(savedOffers));
                    }
                };

                window.addEventListener('storage', syncData);
                const interval = setInterval(syncData, 1000);

                return () => {
                    window.removeEventListener('storage', syncData);
                    clearInterval(interval);
                };
            }, []);

            const handleLogin = (e) => {
                e.preventDefault();
                const currentSavedUser = localStorage.getItem('kimou_admin_user') || 'admin_kimou';
                const currentSavedPass = localStorage.getItem('kimou_admin_pass') || '123456';

                if (loginUser === currentSavedUser && loginPass === currentSavedPass) {
                    setIsLoggedIn(true);
                    setLoginError('');
                    setLoginPass('');
                } else {
                    setLoginError('اسم المستخدم أو كلمة المرور غير صحيحة!');
                }
            };

            const handlePasswordChange = (e) => {
                e.preventDefault();
                if (!newPassword) return;
                setPassword(newPassword);
                localStorage.setItem('kimou_admin_pass', newPassword);
                setNewPassword('');
                setPassMsg('تم تحديث كلمة المرور وحفظها بنجاح!');
                setTimeout(() => setPassMsg(''), 3000);
            };

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewOffer(prev => ({ ...prev, image: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddOffer = (e) => {
                e.preventDefault();
                if (!newOffer.title) return;
                const updatedOffers = [{ ...newOffer, id: Date.now(), image: newOffer.image || 'https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?auto=format&fit=crop&w=600&q=80' }, ...offers];
                setOffers(updatedOffers);
                localStorage.setItem('kimou_offers', JSON.stringify(updatedOffers));
                setNewOffer({ title: '', duration: '', departureDate: '', returnDate: '', price: '', desc: '', image: '' });
                alert('تم نشر العرض بنجاح!');
            };

            const deleteOffer = (id) => {
                const updatedOffers = offers.filter(o => o.id !== id);
                setOffers(updatedOffers);
                localStorage.setItem('kimou_offers', JSON.stringify(updatedOffers));
            };

            // 1. نقل الحجز إلى خانة الرسالة المرسلة (notified) + فتح الواتساب برسالة جديدة
            const sendNotification = (booking) => {
                const updatedBookings = bookings.map(b => b.id === booking.id ? { ...b, status: 'notified' } : b);
                setBookings(updatedBookings);
                localStorage.setItem('kimou_bookings', JSON.stringify(updatedBookings));

                let cleanPhone = booking.phone ? booking.phone.replace(/\s+/g, '') : '';
                if (cleanPhone.startsWith('0')) {
                    cleanPhone = '213' + cleanPhone.substring(1);
                }

                // الرسالة الجديدة المعدلة للزبون
                const message = `Bonjour ${booking.name},\n\n` +
                                `Votre demande de réservation pour le voyage *${booking.trip}* a bien été reçue par l'agence *Kimou Travel* ✈️.\n\n` +
                                `📌 Veuillez vous présenter à notre bureau pour finaliser le paiement et confirmer définitivement votre place.\n\n` +
                                `Pour toute information complémentaire: 0549055155.\n` +
                                `Merci de votre confiance ! 🌟`;

                const encodedMsg = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/${cleanPhone}?text=${encodedMsg}`;
                window.open(whatsappUrl, '_blank');
            };

            // 2. نقل الحجز إلى الخانة النهائية (processed) بعد تأكيد الدفع
            const validateBooking = (id) => {
                const updatedBookings = bookings.map(b => b.id === id ? { ...b, status: 'processed' } : b);
                setBookings(updatedBookings);
                localStorage.setItem('kimou_bookings', JSON.stringify(updatedBookings));
            };

            const deleteBooking = (id) => {
                const updatedBookings = bookings.filter(b => b.id !== id);
                setBookings(updatedBookings);
                localStorage.setItem('kimou_bookings', JSON.stringify(updatedBookings));
            };

            // التصفية للثلاثة أقسام
            const filteredPending = bookings.filter(b => {
                if (b.status !== 'pending') return false;
                if (pendingFilter === 'all') return true;
                return b.trip.toLowerCase().includes(pendingFilter.toLowerCase());
            });

            const filteredNotified = bookings.filter(b => {
                if (b.status !== 'notified') return false;
                if (notifiedFilter === 'all') return true;
                return b.trip.toLowerCase().includes(notifiedFilter.toLowerCase());
            });

            const filteredProcessed = bookings.filter(b => {
                if (b.status !== 'processed') return false;
                if (processedFilter === 'all') return true;
                return b.trip.toLowerCase().includes(processedFilter.toLowerCase());
            });

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-900 px-4">
                        <div className="max-w-md w-full bg-white p-8 rounded-2xl shadow-2xl space-y-6">
                            <div className="text-center space-y-2">
                                <div className="inline-block bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded text-sm mb-2">Kimou Travel</div>
                                <h2 className="text-2xl font-bold text-slate-800">Espace Administration</h2>
                                <p className="text-xs text-slate-500">Veuillez vous connecter pour accéder au panneau de contrôle</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Nom d'utilisateur</label>
                                    <input 
                                        type="text" 
                                        value={loginUser} 
                                        onChange={e => setLoginUser(e.target.value)} 
                                        placeholder="Entrez votre nom d'utilisateur"
                                        className="w-full p-3 text-sm rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">Mot de passe</label>
                                    <input 
                                        type="password" 
                                        value={loginPass} 
                                        onChange={e => setLoginPass(e.target.value)} 
                                        placeholder="••••••••"
                                        className="w-full p-3 text-sm rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500 transition" 
                                        required 
                                    />
                                </div>

                                {loginError && (
                                    <div className="p-3 bg-red-50 text-red-600 border border-red-200 text-xs font-semibold rounded-lg text-center">
                                        {loginError}
                                    </div>
                                )}

                                <button type="submit" className="w-full py-3 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800 transition shadow-md">
                                    Se Connecter 🔒
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-100 flex flex-col">
                    <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow">
                        <div className="flex items-center gap-3">
                            <span className="bg-amber-500 text-slate-900 font-bold px-3 py-1 rounded text-sm">Travel</span>
                            <span className="text-xs text-slate-400 uppercase tracking-widest">Workspace Admin</span>
                        </div>
                        <div className="flex items-center gap-4 text-sm">
                            <a href="index.html" target="_blank" className="text-xs text-amber-400 hover:underline">Voir le Site Public 🌐</a>
                            <span className="text-slate-300">Bienvenue, <strong className="text-white">{username}</strong></span>
                            <button onClick={() => setIsLoggedIn(false)} className="bg-red-600/20 text-red-400 border border-red-600/30 px-3 py-1 rounded hover:bg-red-600 hover:text-white transition">
                                Déconnexion 🚪
                            </button>
                        </div>
                    </header>

                    <main className="p-6 max-w-[1600px] mx-auto w-full space-y-6">
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                <h2 className="font-bold text-slate-800 text-sm border-b pb-2">🔑 Changer le mot de passe</h2>
                                <form onSubmit={handlePasswordChange} className="space-y-3 text-xs">
                                    <div>
                                        <label className="block font-semibold mb-1 text-slate-600">Nouveau mot de passe</label>
                                        <input 
                                            type="password" 
                                            value={newPassword} 
                                            onChange={e => setNewPassword(e.target.value)} 
                                            placeholder="Entrer le nouveau mot de passe"
                                            className="w-full p-2.5 rounded border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-amber-500" 
                                            required 
                                        />
                                    </div>
                                    <button type="submit" className="w-full py-2 bg-slate-900 text-white font-bold rounded hover:bg-slate-800 transition">
                                        Changer le mot de passe
                                    </button>
                                    {passMsg && <p className="text-emerald-600 font-semibold text-center mt-2">{passMsg}</p>}
                                </form>
                            </div>

                            <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                                <h2 className="font-bold text-slate-800 text-sm border-b pb-2">📢 Publier une Nouvelle Offre & Image</h2>
                                <form onSubmit={handleAddOffer} className="space-y-3 text-xs">
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                                        <div className="lg:col-span-2">
                                            <label className="block font-semibold mb-1 text-slate-600">Nom du Circuit / Destination *</label>
                                            <input type="text" value={newOffer.title} onChange={e=>setNewOffer({...newOffer, title: e.target.value})} placeholder="Ex: Grand Sahara - Taghit" className="w-full p-2.5 rounded border bg-slate-50" required />
                                        </div>
                                        <div>
                                            <label className="block font-semibold mb-1 text-slate-600">Séjour / Durée *</label>
                                            <input type="text" value={newOffer.duration} onChange={e=>setNewOffer({...newOffer, duration: e.target.value})} placeholder="Ex: 5 Jours" className="w-full p-2.5 rounded border bg-slate-50" required />
                                        </div>
                                        <div>
                                            <label className="block font-semibold mb-1 text-slate-600">Tarif par Personne *</label>
                                            <input type="text" value={newOffer.price} onChange={e=>setNewOffer({...newOffer, price: e.target.value})} placeholder="Ex: 38,000 DA" className="w-full p-2.5 rounded border bg-slate-50" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-semibold mb-1 text-slate-600">Date de Départ *</label>
                                            <input type="date" value={newOffer.departureDate} onChange={e=>setNewOffer({...newOffer, departureDate: e.target.value})} className="w-full p-2.5 rounded border bg-slate-50" required />
                                        </div>
                                        <div>
                                            <label className="block font-semibold mb-1 text-slate-600">Date de Retour *</label>
                                            <input type="date" value={newOffer.returnDate} onChange={e=>setNewOffer({...newOffer, returnDate: e.target.value})} className="w-full p-2.5 rounded border bg-slate-50" required />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block font-semibold mb-1 text-slate-600">Description du Programme</label>
                                            <textarea value={newOffer.desc} onChange={e=>setNewOffer({...newOffer, desc: e.target.value})} placeholder="Ex: Hôtel 4*, transport..." className="w-full p-2.5 rounded border bg-slate-50 h-16"></textarea>
                                        </div>
                                        <div>
                                            <label className="block font-semibold mb-1 text-slate-600">🖼️ Importer l'Image de la Destination</label>
                                            <input type="file" accept="image/*" onChange={handleImageChange} className="w-full p-1.5 rounded border bg-slate-50 text-[11px]" />
                                            {newOffer.image && <p className="text-emerald-600 mt-1 font-semibold">✓ Image chargée avec succès</p>}
                                        </div>
                                    </div>

                                    <button type="submit" className="w-full py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded transition">
                                        Mettre en Ligne Immédiatement 🚀
                                    </button>
                                </form>
                            </div>
                        </div>

                        {/* قسم الحجوزات المقسم إلى 3 أعمدة */}
                        <div className="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            
                            {/* الخانة 1: الحجوزات الجديدة */}
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-4 printable-section">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h2 className="font-bold text-slate-800 text-xs">📥 Nouvelles (En attente)</h2>
                                    <div className="flex items-center gap-1.5">
                                        <div className="no-print relative inline-block">
                                            <select 
                                                value={pendingFilter} 
                                                onChange={e => setPendingFilter(e.target.value)}
                                                className="bg-amber-600 text-white px-2 py-0.5 rounded text-[11px] font-bold cursor-pointer appearance-none pr-5"
                                            >
                                                <option value="all" className="bg-white text-slate-800">Filtrer : Tous</option>
                                                {offers.map(o => (
                                                    <option key={o.id} value={o.title} className="bg-white text-slate-800">{o.title}</option>
                                                ))}
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1 text-white text-[10px]">▼</div>
                                        </div>
                                        <button onClick={() => window.print()} className="no-print bg-slate-800 text-white px-2 py-0.5 rounded text-[11px] font-bold">🖨️</button>
                                        <span className="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs font-bold">{filteredPending.length}</span>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-500 border-b">
                                            <tr>
                                                <th className="p-1.5">Nom & Tél</th>
                                                <th className="p-1.5">Voyage</th>
                                                <th className="p-1.5 text-center no-print">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {filteredPending.map(b => (
                                                <tr key={b.id} className="hover:bg-slate-50">
                                                    <td className="p-1.5">
                                                        <div className="font-medium text-slate-900">{b.name}</div>
                                                        <div className="text-[10px] text-slate-400">{b.phone}</div>
                                                    </td>
                                                    <td className="p-1.5">
                                                        <div>{b.trip}</div>
                                                        <div className="text-[10px] text-slate-400">{b.date}</div>
                                                    </td>
                                                    <td className="p-1.5 text-center space-x-1 no-print whitespace-nowrap">
                                                        <button 
                                                            onClick={() => sendNotification(b)} 
                                                            className="bg-emerald-600 text-white px-2 py-1 rounded text-[10px] font-bold shadow hover:bg-emerald-700"
                                                            title="Envoyer un message et déplacer vers la 2ème étape"
                                                        >
                                                            Traiter 💬
                                                        </button>
                                                        <button onClick={() => deleteBooking(b.id)} className="bg-red-50 text-red-600 px-1.5 py-1 rounded text-[10px]">✕</button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredPending.length === 0 && (
                                                <tr><td colSpan="3" className="p-3 text-center text-slate-400 text-[11px]">Aucune réservation.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* الخانة 2 الجديدة: الذين تم إرسال رسالة لهم */}
                            <div className="bg-white p-4 rounded-xl border border-blue-200 shadow-sm space-y-4 printable-section">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h2 className="font-bold text-sky-800 text-xs">📲 Message Envoyé (En attente paiement)</h2>
                                    <div className="flex items-center gap-1.5">
                                        <div className="no-print relative inline-block">
                                            <select 
                                                value={notifiedFilter} 
                                                onChange={e => setNotifiedFilter(e.target.value)}
                                                className="bg-sky-600 text-white px-2 py-0.5 rounded text-[11px] font-bold cursor-pointer appearance-none pr-5"
                                            >
                                                <option value="all" className="bg-white text-slate-800">Filtrer : Tous</option>
                                                {offers.map(o => (
                                                    <option key={o.id} value={o.title} className="bg-white text-slate-800">{o.title}</option>
                                                ))}
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1 text-white text-[10px]">▼</div>
                                        </div>
                                        <button onClick={() => window.print()} className="no-print bg-slate-800 text-white px-2 py-0.5 rounded text-[11px] font-bold">🖨️</button>
                                        <span className="bg-sky-100 text-sky-700 px-2 py-0.5 rounded text-xs font-bold">{filteredNotified.length}</span>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-sky-50 text-sky-700 border-b">
                                            <tr>
                                                <th className="p-1.5">Nom & Tél</th>
                                                <th className="p-1.5">Voyage</th>
                                                <th className="p-1.5 text-center no-print">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {filteredNotified.map(b => (
                                                <tr key={b.id} className="hover:bg-slate-50">
                                                    <td className="p-1.5">
                                                        <div className="font-medium text-slate-900">{b.name}</div>
                                                        <div className="text-[10px] text-slate-400">{b.phone}</div>
                                                    </td>
                                                    <td className="p-1.5">
                                                        <div>{b.trip}</div>
                                                        <div className="text-[10px] text-slate-400">{b.date}</div>
                                                    </td>
                                                    <td className="p-1.5 text-center space-x-1 no-print whitespace-nowrap">
                                                        <button 
                                                            onClick={() => validateBooking(b.id)} 
                                                            className="bg-blue-600 text-white px-2 py-1 rounded text-[10px] font-bold shadow hover:bg-blue-700"
                                                            title="Valider le paiement et marquer comme Traité"
                                                        >
                                                            Valider (Payé) ✅
                                                        </button>
                                                        <button onClick={() => deleteBooking(b.id)} className="bg-red-50 text-red-600 px-1.5 py-1 rounded text-[10px]">✕</button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredNotified.length === 0 && (
                                                <tr><td colSpan="3" className="p-3 text-center text-slate-400 text-[11px]">Aucun message envoyé.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* الخانة 3: الحجوزات المؤكدة والنهائية */}
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-4 printable-section">
                                <div className="flex justify-between items-center border-b pb-2">
                                    <h2 className="font-bold text-slate-800 text-xs">✅ Réservations Traitées (Confirmées)</h2>
                                    <div className="flex items-center gap-1.5">
                                        <div className="no-print relative inline-block">
                                            <select 
                                                value={processedFilter} 
                                                onChange={e => setProcessedFilter(e.target.value)}
                                                className="bg-emerald-600 text-white px-2 py-0.5 rounded text-[11px] font-bold cursor-pointer appearance-none pr-5"
                                            >
                                                <option value="all" className="bg-white text-slate-800">Filtrer : Tous</option>
                                                {offers.map(o => (
                                                    <option key={o.id} value={o.title} className="bg-white text-slate-800">{o.title}</option>
                                                ))}
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-1 text-white text-[10px]">▼</div>
                                        </div>
                                        <button onClick={() => window.print()} className="no-print bg-slate-800 text-white px-2 py-0.5 rounded text-[11px] font-bold">🖨️</button>
                                        <span className="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs font-bold">{filteredProcessed.length}</span>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-500 border-b">
                                            <tr>
                                                <th className="p-1.5">Nom & Tél</th>
                                                <th className="p-1.5">Voyage</th>
                                                <th className="p-1.5 text-center no-print">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y">
                                            {filteredProcessed.map(b => (
                                                <tr key={b.id} className="hover:bg-slate-50">
                                                    <td className="p-1.5">
                                                        <div className="font-medium text-slate-900">{b.name}</div>
                                                        <div className="text-[10px] text-slate-400">{b.phone}</div>
                                                    </td>
                                                    <td className="p-1.5">
                                                        <div>{b.trip}</div>
                                                        <div className="text-[10px] text-slate-400">{b.date}</div>
                                                    </td>
                                                    <td className="p-1.5 text-center no-print">
                                                        <button onClick={() => deleteBooking(b.id)} className="bg-red-50 text-red-600 px-2 py-1 rounded text-[10px]">Supprimer</button>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredProcessed.length === 0 && (
                                                <tr><td colSpan="3" className="p-3 text-center text-slate-400 text-[11px]">Aucune réservation confirmée.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>

                        {/* قسم إدارة العروض */}
                        <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                            <h2 className="font-bold text-slate-800 text-sm border-b pb-2">🛠️ Gérer les Offres Existantes & Images</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {offers.map(offer => (
                                    <div key={offer.id} className="p-3 border rounded-lg bg-slate-50 flex gap-3 items-center">
                                        <img src={offer.image} alt={offer.title} className="w-20 h-20 object-cover rounded-md border flex-shrink-0" />
                                        <div className="space-y-1 text-xs flex-grow">
                                            <h3 className="font-bold text-slate-800 text-sm">{offer.title}</h3>
                                            <p className="text-slate-500">Durée: {offer.duration} | Prix: <strong className="text-amber-600">{offer.price}</strong></p>
                                            <p className="text-sky-600 font-semibold">🛫 {offer.departureDate || 'N/A'} ➔ 🛬 {offer.returnDate || 'N/A'}</p>
                                            <p className="text-slate-600 truncate max-w-xs">{offer.desc}</p>
                                        </div>
                                        <button onClick={() => deleteOffer(offer.id)} className="bg-red-500 text-white px-2.5 py-1 rounded text-xs font-bold hover:bg-red-600 flex-shrink-0">Supprimer</button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
